services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-paperclip-dev}
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://localhost:6333/readyz | grep -q ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/paperclip-dev}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  zep:
    image: ghcr.io/getzep/zep:latest
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ZEP_API_SECRET: ${ZEP_API_SECRET:-paperclip-dev-secret}
      ZEP_GRAPHITI__NEO4J_URI: bolt://neo4j:7687
      ZEP_GRAPHITI__NEO4J_USER: neo4j
      ZEP_GRAPHITI__NEO4J_PASSWORD: paperclip-dev
      ZEP_LLM__SERVICE: openai
      ZEP_LLM__OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZEP_EMBEDDING__SERVICE: openai
      ZEP_EMBEDDING__OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant_storage:
  neo4j_data:
  neo4j_logs:
